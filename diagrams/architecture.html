<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tic-tac-toe — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · tic-tac-toe</p>
    <h1>Guest-first play, host-authoritative online rooms</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tic-tac-toe-arch-title tic-tac-toe-arch-desc">
        <title id="tic-tac-toe-arch-title">tic-tac-toe — architecture</title>
        <desc id="tic-tac-toe-arch-desc">Generated guest identity feeds the React UI and hooks over the pure game engine, while the online path runs from the UI through the peer-room host authority and matchmaking client to the external fuurma-matchmaking relay.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (before boxes) -->
        <!-- identity -> UI -->
        <line x1="316" y1="160" x2="404" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- UI -> hooks -->
        <line x1="596" y1="160" x2="684" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- hooks -> engine (headline) -->
        <line x1="876" y1="160" x2="964" y2="160" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- UI -> peer : ONLINE -->
        <line x1="500" y1="208" x2="500" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="512" y="248" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONLINE</text>
        <!-- room -> peer -->
        <line x1="316" y1="352" x2="404" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- peer -> relay : WEBSOCKET (external, link-blue) -->
        <line x1="596" y1="352" x2="684" y2="352" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="610" y="328" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBSOCKET</text>
        <!-- matchmaking -> relay -->
        <line x1="964" y1="352" x2="876" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <!-- identity : input -->
        <rect x="124" y="112" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="124" y="112" width="192" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="132" y="118" width="38" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.60)" stroke-width="0.8"/>
        <text x="151" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUEST</text>
        <text x="220" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guest identity</text>
        <text x="220" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/lib/identity.ts</text>

        <!-- UI : backend -->
        <rect x="404" y="112" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="404" y="112" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="412" y="118" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="429" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
        <text x="500" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UI surfaces</text>
        <text x="500" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/components</text>

        <!-- hooks : backend -->
        <rect x="684" y="112" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="684" y="112" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="692" y="118" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="712" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
        <text x="780" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hooks</text>
        <text x="780" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/hooks</text>

        <!-- engine : focal -->
        <rect x="964" y="112" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="964" y="112" width="192" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="972" y="118" width="34" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="989" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PURE</text>
        <text x="1060" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Game engine</text>
        <text x="1060" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/game · logic + ai</text>

        <!-- room : backend -->
        <rect x="124" y="304" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="124" y="304" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="132" y="310" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="150" y="319" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOM</text>
        <text x="220" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Room client</text>
        <text x="220" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">room.ts · roomId.ts</text>

        <!-- peer : backend -->
        <rect x="404" y="304" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="404" y="304" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="412" y="310" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="433" y="319" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="500" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Peer room</text>
        <text x="500" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">peer.ts · host authority</text>

        <!-- relay : external -->
        <rect x="684" y="304" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="684" y="304" width="192" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="692" y="310" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="716" y="319" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="780" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fuurma-matchmaking</text>
        <text x="780" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GameRoomDO · quick match</text>

        <!-- matchmaking : backend -->
        <rect x="964" y="304" width="192" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="964" y="304" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="972" y="310" width="38" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="991" y="319" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
        <text x="1060" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Matchmaking</text>
        <text x="1060" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/lib/matchmaking.ts</text>

        <!-- Legend -->
        <line x1="124" y1="592" x2="1156" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="124" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="212" y="624" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="232" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PURE ENGINE · FOCAL</text>
        <rect x="424" y="624" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="444" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">APP LAYER</text>
        <rect x="568" y="624" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="588" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">GENERATED INPUT</text>
        <rect x="752" y="624" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="772" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL WORKER</text>
        <line x1="936" y1="630" x2="968" y2="630" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="976" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FLOW</text>
        <line x1="1040" y1="630" x2="1072" y2="630" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="1080" y="634" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">WEBSOCKET</text>
      </svg>
    </div>
  </div>
</body>
</html>
